<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essay Evaluation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 8px;
            display: none;
        }
        .error {
            color: red;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Submit Your Essay for Evaluation</h1>
    <form id="essayForm">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="topic">Essay Topic:</label>
        <input type="text" id="topic" name="topic" required>

        <label for="essay">Your Essay:</label>
        <textarea id="essay" name="essay" rows="10" required></textarea>

        <button type="submit">Submit for Evaluation</button>
    </form>

    <div class="result" id="result"></div>
    <div class="error" id="error">Something went wrong. Please try again.</div>

    <script>
        document.getElementById('essayForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const topic = document.getElementById('topic').value;
            const essay = document.getElementById('essay').value;

            const responseDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            responseDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/evaluate_essay', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, topic, essay })
                });

                if (response.ok) {
                    const result = await response.json();
                    responseDiv.textContent = result.evaluation;
                    responseDiv.style.display = 'block';
                } else {
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.style.display = 'block';
            }
        });
    </script>

</body>
</html>
