<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Bank of Roachathon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">
  <div class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
      <div class="flex flex-col items-center mb-6">
        <i class="fas fa-user-plus text-blue-500 text-5xl mb-2"></i>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Create Account</h2>
        <p class="text-gray-500">Register to get started</p>
      </div>
      <form method="POST" class="space-y-6">
        <div>
          <label class="block text-gray-700 mb-1" for="first_name">First Name</label>
          <input name="first_name" id="first_name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="First Name" required>
        </div>
        <div>
          <label class="block text-gray-700 mb-1" for="last_name">Last Name</label>
          <input name="last_name" id="last_name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Last Name" required>
        </div>
        <div>
          <label class="block text-gray-700 mb-1" for="username">Username</label>
          <input name="username" id="username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Username" required>
        </div>
        <div>
          <label class="block text-gray-700 mb-1" for="email">Email</label>
          <input name="email" id="email" type="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Email" required>
        </div>
        <div>
          <label class="block text-gray-700 mb-1" for="password">Password</label>
          <input name="password" id="password" type="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Password" required>
        </div>
        {% if error %}
          <p class="text-red-500 text-sm">{{ error }}</p>
        {% endif %}
        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition duration-300 font-semibold">
          <i class="fas fa-user-plus mr-2"></i>Register
        </button>
      </form>
      <div class="mt-6 text-center">
        <a href="/login" class="text-blue-500 hover:underline">Already have an account? Login</a>
      </div>
    </div>
  </div>
</body>
</html>
